services:
  songjiang-server:
    build: .
    image: songjiang-server:1.0.0
    container_name: songjiang-server
    restart: unless-stopped
    ports:
      - "8000:8000"
    volumes:
      - ./data:/data
    environment:
      - SONGJIANG_DATA=/data
      # 写接口凭据：留空时写接口一律 503（fail-closed），读接口仍可用。
      # 建议在宿主 .env 或 shell 里导出 SONGJIANG_TOKEN 后再 up。
      - SONGJIANG_TOKEN=${SONGJIANG_TOKEN:-}
      # 可选：单次上传上限（字节）。留空用默认 64 MiB。
      - SONGJIANG_MAX_UPLOAD=${SONGJIANG_MAX_UPLOAD:-}
