# build_runner 配置
# lib/design/ 是独立设计模块。flutter_svg 依赖树与 build/source_gen
# 版本冲突导致 "Cannot recurse at later or equal phase 3"。
# 需要同时排除 build 和 resolve 阶段的源。
targets:
  $default:
    sources:
      exclude:
        - lib/design/**
    builders:
      build_runner|combining_builder:
        enabled_for:
          exclude:
            - lib/design/**
      source_gen|combining_builder:
        enabled_for:
          exclude:
            - lib/design/**
