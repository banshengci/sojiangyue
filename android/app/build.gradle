plugins {
    id "com.android.application"
    id "kotlin-android"
    id "dev.flutter.flutter-gradle-plugin"
}

def localProperties = new Properties()
def localPropertiesFile = rootProject.file('local.properties')
if (localPropertiesFile.exists()) {
    localPropertiesFile.withReader('UTF-8') { reader ->
        localProperties.load(reader)
    }
}

def flutterVersionCode = localProperties.getProperty('flutter.versionCode')
if (flutterVersionCode == null) {
    flutterVersionCode = '1'
}

def flutterVersionName = localProperties.getProperty('flutter.versionName')
if (flutterVersionName == null) {
    flutterVersionName = '1.0'
}

def keystoreProperties = new Properties()
def keystorePropertiesFile = rootProject.file('key.properties')
if (keystorePropertiesFile.exists()) {
    keystoreProperties.load(new FileInputStream(keystorePropertiesFile))
}

android {
    namespace "com.songjiang.reader"
    // compileSdk flutter.compileSdkVersion
    compileSdk 36
    ndkVersion flutter.ndkVersion

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    kotlinOptions {
        jvmTarget = '1.8'
    }

    sourceSets {
        main.java.srcDirs += 'src/main/kotlin'
    }

    defaultConfig {
        applicationId "com.songjiang.reader"
        // You can update the following values to match your application needs.
        // For more information, see: https://docs.flutter.dev/deployment/android#reviewing-the-gradle-build-configuration.
        minSdkVersion flutter.minSdkVersion
        targetSdkVersion 36
        versionCode flutterVersionCode.toInteger()
        versionName flutterVersionName
    }

    signingConfigs {
        debug {
            // 默认使用 Android SDK 自带的 debug keystore（~/.android/debug.keystore）。
            // 部分受限环境（沙箱/CI 容器）无法写入 ~/.android，AGP 创建默认 keystore 会失败。
            // 此时在 android/app/ 放一个 debug.keystore 即可自动生效（标准密码/别名如下）。
            def localDebugKeystore = file('debug.keystore')
            if (localDebugKeystore.exists()) {
                storeFile localDebugKeystore
                storePassword 'android'
                keyAlias 'androiddebugkey'
                keyPassword 'android'
            }
        }
        release {
            keyAlias keystoreProperties['keyAlias']
            keyPassword keystoreProperties['keyPassword']
            storeFile keystoreProperties['storeFile'] ? file(keystoreProperties['storeFile']) : null
            storePassword keystoreProperties['storePassword']
        }
    }

    buildTypes {
        debug {
            signingConfig signingConfigs.debug
        }
        release {
            // signingConfig signingConfigs.debug
            signingConfig signingConfigs.release

        }
    }

    applicationVariants.all { variant ->
        variant.outputs.each { output ->
            def abiVersionCode = 0
            if (output.getFilter(com.android.build.OutputFile.ABI) != null) {
                def abiName = output.getFilter(com.android.build.OutputFile.ABI)
                switch(abiName) {
                    case "armeabi-v7a":
                        abiVersionCode = 0 
                        break
                    case "arm64-v8a":
                        abiVersionCode = 0
                        break
                    case "x86":
                        abiVersionCode = 0
                        break
                    case "x86_64":
                        abiVersionCode = 0
                        break
                }
            }
            output.versionCodeOverride = flutterVersionCode.toInteger() + abiVersionCode
        }
    }
}

flutter {
    source '../..'
}

dependencies {}
