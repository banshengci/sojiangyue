name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]

# 鍙栨秷鍚屼竴鍒嗘敮/鍚屼竴 PR 涓婃鍦ㄨ窇鐨勬棫 run锛岄伩鍏嶈祫婧愭氮璐?concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ============ 鍒嗘瀽 + 鍗曞厓娴嬭瘯 (Linux, 鏈€蹇? ============
  analyze-and-test:
    name: Analyze & test (ubuntu)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter 3.35.3
        uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.35.3
          channel: stable

      - name: Cache pub dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.pub-cache
            .dart_tool/package_config.json
          key: ${{ runner.os }}-pub-${{ hashFiles('**/pubspec.lock') }}
          restore-keys: |
            ${{ runner.os }}-pub-

      - name: Install dependencies
        run: flutter pub get

      - name: Generate code (l10n + build_runner)
        shell: bash
        run: |
          rm -f build.yaml
          flutter gen-l10n
          dart run build_runner build --delete-conflicting-outputs

      # Flutter analyze 鍦ㄩ儴鍒嗙増鏈 info 涔熶細 exit 1锛堝嵆浣?--no-fatal-infos锛夈€?      # 浠ユ棩蹇楅噷鏄惁鍑虹幇 error 绾ч棶棰樹负鍑嗭紝info/warning 涓嶉樆濉炪€?      - name: Analyze
        run: |
          set +e
          OUTPUT=$(flutter analyze --no-pub --no-fatal-infos --no-fatal-warnings 2>&1)
          CODE=$?
          set -e
          echo "$OUTPUT"
          echo "flutter analyze raw exit=$CODE"
          if echo "$OUTPUT" | grep -E '^\s*error\s+-'; then
            echo "::error::flutter analyze reported error-level issues"
            exit 1
          fi
          if echo "$OUTPUT" | grep -qi 'failed to compile\|error-causing\|Unhandled exception'; then
            echo "::error::flutter analyze failed to complete"
            exit 1
          fi
          echo "Analyze OK (no error-level issues)"

      - name: Run tests
        run: flutter test --no-pub --reporter expanded

  # ============ Windows ============
  # Flutter 3.35.3 鐨?CMake 鐢熸垚鍣ㄧ‖缂栫爜 "Visual Studio 16 2019"锛?  # 蹇呴』鐢?windows-2019 runner锛堣嚜甯?VS 2019锛夛紝windows-latest 鍙湁 VS 2022 涓嶅尮閰嶃€?  build-windows:
    name: Build Windows
    runs-on: windows-2019
    timeout-minutes: 60
    needs: analyze-and-test
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Enable git long paths
        run: git config --system core.longpaths true

      - name: Setup Flutter 3.35.3
        uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.35.3
          channel: stable

      - name: Cache pub dependencies
        uses: actions/cache@v4
        with:
          path: |
            C:\Users\runneradmin\.pub-cache
            .dart_tool/package_config.json
          key: ${{ runner.os }}-pub-${{ hashFiles('**/pubspec.lock') }}
          restore-keys: |
            ${{ runner.os }}-pub-

      - name: Enable git long paths
        run: git config --system core.longpaths true

      - name: Install dependencies
        run: flutter pub get

      - name: Generate code (l10n + build_runner)
        shell: bash
        run: |
          rm -f build.yaml
          flutter gen-l10n
          dart run build_runner build --delete-conflicting-outputs

      - name: Build Windows (release)
        run: flutter build windows --release

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: songjiang_reader-windows-release
          path: build/windows/x64/runner/Release
          if-no-files-found: warn
          retention-days: 7

  # ============ Android ============
  build-android:
    name: Build Android (debug APK)
    runs-on: windows-latest
    timeout-minutes: 60
    needs: analyze-and-test
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Flutter 3.35.3
        uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.35.3
          channel: stable

      - name: Cache pub dependencies
        uses: actions/cache@v4
        with:
          path: |
            C:\Users\runneradmin\.pub-cache
            .dart_tool/package_config.json
          key: ${{ runner.os }}-pub-${{ hashFiles('**/pubspec.lock') }}
          restore-keys: |
            ${{ runner.os }}-pub-

      # 椤圭洰鏈夊涓?git 渚濊禆锛坒lutter_inappwebview 绛夛級锛屽叾婧愮爜璺緞寰堟繁銆?      # Windows 榛樿 260 瀛楃璺緞闄愬埗浼氳 pub 鍏嬮殕鏃堕潤榛樻紡鎺夐儴鍒嗘簮鏂囦欢锛?      # 琛ㄧ幇涓虹紪璇戞湡鑾悕鍏跺鐨勨€滄壘涓嶅埌绗﹀彿鈥濄€傚繀椤诲厛寮€鍚?long paths銆?      - name: Enable git long paths
        run: git config --system core.longpaths true

      # android/.gitignore 浼氬拷鐣?gradlew / gradlew.bat / gradle-wrapper.jar
      # 锛團lutter 妯℃澘榛樿濡傛锛夛紝checkout 鍚庨」鐩噷娌℃湁 wrapper銆?      # 棣栨 `flutter build apk` 鐢熸垚 wrapper 鏃跺鏄撳崱浣忥紝杩欓噷鏄惧紡琛ラ綈銆?      - name: Ensure Gradle wrapper
        shell: bash
        run: |
          SDK="$(dirname "$(dirname "$(command -v flutter)")")"
          cp "$SDK/bin/cache/artifacts/gradle_wrapper/gradlew" android/gradlew
          cp "$SDK/bin/cache/artifacts/gradle_wrapper/gradlew.bat" android/gradlew.bat
          mkdir -p android/gradle/wrapper
          cp "$SDK/bin/cache/artifacts/gradle_wrapper/gradle/wrapper/gradle-wrapper.jar" android/gradle/wrapper/gradle-wrapper.jar

      # sqlite3_flutter_libs 绛夋彃浠堕渶瑕?CMake 缂栬瘧 native 浠ｇ爜
      - name: Install Android CMake & NDK
        shell: bash
        run: |
          SM="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          [ -x "$SM" ] || SM="$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SM" --install "cmake;3.22.1" "ndk;27.0.12077973" || true

      - name: Install dependencies
        run: flutter pub get

      - name: Generate code (l10n + build_runner)
        shell: bash
        run: |
          rm -f build.yaml
          flutter gen-l10n
          dart run build_runner build --delete-conflicting-outputs

      - name: Build Android (debug APK)
        shell: bash
        run: |
          for i in 1 2 3; do
            echo "=== Attempt $i ==="
            flutter build apk --debug --no-pub && break
            echo "Attempt $i failed, retrying in 10s..."
            sleep 10
          done

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: songjiang_reader-android-debug
          path: build/app/outputs/flutter-apk/*.apk
          if-no-files-found: warn
          retention-days: 7

  # ============ Android release锛堟墦 tag 鏃舵墠璺戯級 ============
  # 闇€瑕佸湪浠撳簱 Settings 鈫?Secrets 閲岄厤缃細
  #   KEYSTORE_BASE64      = base64 -w0 android/app/release.jks
  #   KEYSTORE_PASSWORD / KEY_ALIAS / KEY_PASSWORD
  build-android-release:
    name: Build Android (release AAB + APK)
    runs-on: windows-latest
    timeout-minutes: 90
    needs: analyze-and-test
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Flutter 3.35.3
        uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.35.3
          channel: stable

      - name: Enable git long paths
        run: git config --system core.longpaths true

      - name: Ensure Gradle wrapper
        shell: bash
        run: |
          SDK="$(dirname "$(dirname "$(command -v flutter)")")"
          cp "$SDK/bin/cache/artifacts/gradle_wrapper/gradlew" android/gradlew
          cp "$SDK/bin/cache/artifacts/gradle_wrapper/gradlew.bat" android/gradlew.bat
          mkdir -p android/gradle/wrapper
          cp "$SDK/bin/cache/artifacts/gradle_wrapper/gradle/wrapper/gradle-wrapper.jar" android/gradle/wrapper/gradle-wrapper.jar

      - name: Install Android CMake & NDK
        shell: bash
        run: |
          SM="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          [ -x "$SM" ] || SM="$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SM" --install "cmake;3.22.1" "ndk;27.0.12077973" || true

      - name: Restore signing keystore
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "鏈厤缃鍚嶅瘑閽ワ紝璺宠繃锛坮elease 鏋勫缓灏嗕娇鐢?debug 绛惧悕锛?
            exit 0
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > android/app/release.jks
          cat > android/key.properties <<EOF
          storeFile=release.jks
          storePassword=$KEYSTORE_PASSWORD
          keyAlias=$KEY_ALIAS
          keyPassword=$KEY_PASSWORD
          EOF

      - name: Install dependencies
        run: flutter pub get

      - name: Generate code (l10n + build_runner)
        shell: bash
        run: |
          rm -f build.yaml
          flutter gen-l10n
          dart run build_runner build --delete-conflicting-outputs

      - name: Build release APK & AAB
        run: |
          flutter build apk --release --no-pub
          flutter build appbundle --release --no-pub

      - name: Upload release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: songjiang_reader-android-release-${{ github.ref_name }}
          path: |
            build/app/outputs/flutter-apk/*.apk
            build/app/outputs/bundle/release/*.aab
          if-no-files-found: warn
          retention-days: 30

  # ============ macOS ============
  # Flutter 3.35 鐨?macos 瀛愬懡浠ゅ凡鏃?--no-codesign锛?  # debug 榛樿涓?codesign锛?-codesign defaultsTo release锛夈€?  build-macos:
    name: Build macOS
    runs-on: macos-latest
    timeout-minutes: 60
    needs: analyze-and-test
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter 3.35.3
        uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.35.3
          channel: stable

      - name: Cache pub dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.pub-cache
            .dart_tool/package_config.json
          key: ${{ runner.os }}-pub-${{ hashFiles('**/pubspec.lock') }}
          restore-keys: |
            ${{ runner.os }}-pub-

      - name: Install dependencies
        run: flutter pub get

      - name: Generate code (l10n + build_runner)
        shell: bash
        run: |
          rm -f build.yaml
          flutter gen-l10n
          dart run build_runner build --delete-conflicting-outputs

      - name: Prepare CocoaPods
        run: |
          pod --version
          pod repo remove trunk 2>/dev/null || true
          pod repo add-cdn trunk https://cdn.cocoapods.org/
          rm -f macos/Podfile.lock

      - name: Build macOS (debug)
        run: flutter build macos --debug --no-pub

      - name: Upload macOS artifact
        uses: actions/upload-artifact@v4
        with:
          name: songjiang_reader-macos-debug
          path: build/macos/Build/Products/Debug/*.app
          if-no-files-found: warn
          retention-days: 7

  # ============ iOS锛堟棤寮€鍙戣€呰处鍙凤細鎵撳嚭鏈鍚?IPA锛屼緵 TrollStore 渚ц浇锛?============
  # 涓汉璁惧锛堝 iPhone 14 / iOS 16.1 + TrollStore锛夋棤闇€浠樿垂寮€鍙戣€呰处鍙枫€?  # 浜х墿涓?--no-codesign 鐨?Runner.app 鎵撴垚 .ipa锛岀敱璁惧绔?TrollStore 閲嶇瀹夎銆?  build-ios-unsigned:
    name: Build iOS (unsigned IPA / TrollStore)
    runs-on: macos-latest
    timeout-minutes: 90
    needs: analyze-and-test
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter 3.35.3
        uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.35.3
          channel: stable

      - name: Cache pub dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.pub-cache
            .dart_tool/package_config.json
          key: ${{ runner.os }}-pub-${{ hashFiles('**/pubspec.lock') }}
          restore-keys: |
            ${{ runner.os }}-pub-

      - name: Install dependencies
        run: flutter pub get

      - name: Generate code (l10n + build_runner)
        shell: bash
        run: |
          rm -f build.yaml
          flutter gen-l10n
          dart run build_runner build --delete-conflicting-outputs

      - name: Prepare CocoaPods
        run: |
          pod --version
          pod repo remove trunk 2>/dev/null || true
          pod repo add-cdn trunk https://cdn.cocoapods.org/
          rm -f ios/Podfile.lock

      - name: Build iOS (release, no codesign)
        run: flutter build ios --release --no-codesign --no-pub

      - name: Package IPA
        run: |
          set -euo pipefail
          APP_DIR="build/ios/iphoneos"
          # 閮ㄥ垎 Flutter 鐗堟湰杈撳嚭鍦?Release-iphoneos
          if [ ! -d "$APP_DIR/Runner.app" ]; then
            APP_DIR="build/ios/Release-iphoneos"
          fi
          test -d "$APP_DIR/Runner.app"
          STAGE=$(mktemp -d)
          mkdir -p "$STAGE/Payload"
          cp -R "$APP_DIR/Runner.app" "$STAGE/Payload/"
          (
            cd "$STAGE"
            zip -qry SongJiang-Reader-ios-unsigned.ipa Payload
          )
          mkdir -p build/ios-artifacts
          cp "$STAGE/SongJiang-Reader-ios-unsigned.ipa" build/ios-artifacts/
          ls -la build/ios-artifacts/

      - name: Upload iOS IPA
        uses: actions/upload-artifact@v4
        with:
          name: songjiang_reader-ios-unsigned-ipa
          path: build/ios-artifacts/*.ipa
          if-no-files-found: error
          retention-days: 14

  # ============ Linux ============
  build-linux:
    name: Build Linux (debug)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    needs: analyze-and-test
    # WPE WebKit 鍦ㄩ儴鍒?Ubuntu 闀滃儚涓婂寘鍚嶄笉绋冲畾锛汱inux 闈炰富鐩爣锛屽け璐ヤ笉闃诲
    continue-on-error: true
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          # flutter_inappwebview_linux 闇€瑕?WPE WebKit
          sudo apt-get install -y \
            clang cmake ninja-build pkg-config \
            libgtk-3-dev liblzma-dev libstdc++-12-dev \
            libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev \
            libasound2-dev \
            libwpe-1.0-dev libwpebackend-fdo-1.0-dev \
            libwpewebkit-1.0-dev || \
          sudo apt-get install -y \
            clang cmake ninja-build pkg-config \
            libgtk-3-dev liblzma-dev libstdc++-12-dev \
            libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev \
            libasound2-dev \
            libwpe-1.0-dev libwpebackend-fdo-1.0-dev

      - name: Setup Flutter 3.35.3
        uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.35.3
          channel: stable

      - name: Cache pub dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.pub-cache
            .dart_tool/package_config.json
          key: ${{ runner.os }}-pub-${{ hashFiles('**/pubspec.lock') }}
          restore-keys: |
            ${{ runner.os }}-pub-

      - name: Install dependencies
        run: flutter pub get

      - name: Generate code (l10n + build_runner)
        shell: bash
        run: |
          rm -f build.yaml
          flutter gen-l10n
          dart run build_runner build --delete-conflicting-outputs

      - name: Build Linux (debug)
        run: flutter build linux --debug --no-pub

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: songjiang_reader-linux-debug
          path: build/linux/x64/debug/bundle
          if-no-files-found: warn
          retention-days: 7

