name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# 取消同一分支/同一 PR 上正在跑的旧 run，避免资源浪费
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # 分析 + 单元测试 (Linux, 最快)
  analyze-and-test:
    name: Analyze & test (ubuntu)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter 3.35.3
        uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.35.3
          channel: stable

      - name: Cache pub dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.pub-cache
            .dart_tool/package_config.json
          key: ${{ runner.os }}-pub-${{ hashFiles('**/pubspec.lock') }}
          restore-keys: |
            ${{ runner.os }}-pub-

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze --no-pub

      - name: Run tests
        run: flutter test --no-pub --reporter expanded

  # Windows 构建（windows-latest 自带完整 Visual Studio，含 ATL 等组件）
  build-windows:
    name: Build Windows (debug)
    runs-on: windows-latest
    timeout-minutes: 60
    needs: analyze-and-test
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter 3.35.3
        uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.35.3
          channel: stable

      - name: Cache pub dependencies
        uses: actions/cache@v4
        with:
          path: |
            C:\Users\runneradmin\.pub-cache
            .dart_tool/package_config.json
          key: ${{ runner.os }}-pub-${{ hashFiles('**/pubspec.lock') }}
          restore-keys: |
            ${{ runner.os }}-pub-

      - name: Install dependencies
        run: flutter pub get

      - name: Build Windows (debug)
        run: flutter build windows --debug --no-pub

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: songjiang_reader-windows-debug
          path: build/windows/x64/runner/Debug
          if-no-files-found: warn
          retention-days: 7

  # Android 构建（windows-latest，自带 JDK 17 + Android SDK 预装）
  build-android:
    name: Build Android (debug APK)
    runs-on: windows-latest
    timeout-minutes: 60
    needs: analyze-and-test
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Flutter 3.35.3
        uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.35.3
          channel: stable

      - name: Cache pub dependencies
        uses: actions/cache@v4
        with:
          path: |
            C:\Users\runneradmin\.pub-cache
            .dart_tool/package_config.json
          key: ${{ runner.os }}-pub-${{ hashFiles('**/pubspec.lock') }}
          restore-keys: |
            ${{ runner.os }}-pub-

      # 项目有多个 git 依赖（flutter_inappwebview 等），其源码路径很深。
      # Windows 默认 260 字符路径限制会让 pub 克隆时静默漏掉部分源文件，
      # 表现为编译期莫名其妙的“找不到符号”。必须先开启 long paths。
      - name: Enable git long paths
        run: git config --system core.longpaths true

      # android/.gitignore 会忽略 gradlew / gradlew.bat / gradle-wrapper.jar
      # （Flutter 模板默认如此），checkout 后项目里没有 wrapper。
      # 首次 `flutter build apk` 生成 wrapper 时容易卡住，这里显式补齐。
      - name: Ensure Gradle wrapper
        shell: bash
        run: |
          SDK="$(dirname "$(dirname "$(command -v flutter)")")"
          cp "$SDK/bin/cache/artifacts/gradle_wrapper/gradlew" android/gradlew
          cp "$SDK/bin/cache/artifacts/gradle_wrapper/gradlew.bat" android/gradlew.bat
          mkdir -p android/gradle/wrapper
          cp "$SDK/bin/cache/artifacts/gradle_wrapper/gradle/wrapper/gradle-wrapper.jar" android/gradle/wrapper/gradle-wrapper.jar

      # sqlite3_flutter_libs 等插件需要 CMake 编译 native 代码
      - name: Install Android CMake & NDK
        shell: bash
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "cmake;3.22.1" "ndk;27.0.12077973" || \
          yes | "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" --install "cmake;3.22.1" "ndk;27.0.12077973"

      - name: Install dependencies
        run: flutter pub get

      - name: Build Android (debug APK)
        run: flutter build apk --debug --no-pub

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: songjiang_reader-android-debug
          path: build/app/outputs/flutter-apk/*.apk
          if-no-files-found: warn
          retention-days: 7