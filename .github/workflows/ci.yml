name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]

# 取消同一分支/同一 PR 上正在跑的旧 run，避免资源浪费
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ============ 分析 + 单元测试 (Linux, 最快) ============
  analyze-and-test:
    name: Analyze & test (ubuntu)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter 3.35.3
        uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.35.3
          channel: stable

      - name: Cache pub dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.pub-cache
            .dart_tool/package_config.json
          key: ${{ runner.os }}-pub-${{ hashFiles('**/pubspec.lock') }}
          restore-keys: |
            ${{ runner.os }}-pub-

      - name: Install dependencies
        run: flutter pub get

      - name: Generate code (l10n + build_runner)
        run: |
          flutter gen-l10n
          dart run build_runner build --delete-conflicting-outputs

      - name: Analyze
        run: flutter analyze --no-pub --no-fatal-infos --no-fatal-warnings

      - name: Run tests
        run: flutter test --no-pub --reporter expanded

  # ============ Windows ============
  # Flutter 3.35.3 的 CMake 生成器硬编码 "Visual Studio 16 2019"，
  # 必须用 windows-2019 runner（自带 VS 2019），windows-latest 只有 VS 2022 不匹配。
  build-windows:
    name: Build Windows
    runs-on: windows-2019
    timeout-minutes: 60
    needs: analyze-and-test
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Enable git long paths
        run: git config --system core.longpaths true

      - name: Setup Flutter 3.35.3
        uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.35.3
          channel: stable

      - name: Cache pub dependencies
        uses: actions/cache@v4
        with:
          path: |
            C:\Users\runneradmin\.pub-cache
            .dart_tool/package_config.json
          key: ${{ runner.os }}-pub-${{ hashFiles('**/pubspec.lock') }}
          restore-keys: |
            ${{ runner.os }}-pub-

      - name: Enable git long paths
        run: git config --system core.longpaths true

      - name: Install dependencies
        run: flutter pub get

      - name: Generate code (l10n + build_runner)
        run: |
          flutter gen-l10n
          dart run build_runner build --delete-conflicting-outputs

      - name: Build Windows (release)
        run: flutter build windows --release

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: songjiang_reader-windows-release
          path: build/windows/x64/runner/Release
          if-no-files-found: warn
          retention-days: 7

  # ============ Android ============
  build-android:
    name: Build Android (debug APK)
    runs-on: windows-latest
    timeout-minutes: 60
    needs: analyze-and-test
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Flutter 3.35.3
        uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.35.3
          channel: stable

      - name: Cache pub dependencies
        uses: actions/cache@v4
        with:
          path: |
            C:\Users\runneradmin\.pub-cache
            .dart_tool/package_config.json
          key: ${{ runner.os }}-pub-${{ hashFiles('**/pubspec.lock') }}
          restore-keys: |
            ${{ runner.os }}-pub-

      # 项目有多个 git 依赖（flutter_inappwebview 等），其源码路径很深。
      # Windows 默认 260 字符路径限制会让 pub 克隆时静默漏掉部分源文件，
      # 表现为编译期莫名其妙的“找不到符号”。必须先开启 long paths。
      - name: Enable git long paths
        run: git config --system core.longpaths true

      # android/.gitignore 会忽略 gradlew / gradlew.bat / gradle-wrapper.jar
      # （Flutter 模板默认如此），checkout 后项目里没有 wrapper。
      # 首次 `flutter build apk` 生成 wrapper 时容易卡住，这里显式补齐。
      - name: Ensure Gradle wrapper
        shell: bash
        run: |
          SDK="$(dirname "$(dirname "$(command -v flutter)")")"
          cp "$SDK/bin/cache/artifacts/gradle_wrapper/gradlew" android/gradlew
          cp "$SDK/bin/cache/artifacts/gradle_wrapper/gradlew.bat" android/gradlew.bat
          mkdir -p android/gradle/wrapper
          cp "$SDK/bin/cache/artifacts/gradle_wrapper/gradle/wrapper/gradle-wrapper.jar" android/gradle/wrapper/gradle-wrapper.jar

      # sqlite3_flutter_libs 等插件需要 CMake 编译 native 代码
      - name: Install Android CMake & NDK
        shell: bash
        run: |
          SM="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          [ -x "$SM" ] || SM="$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SM" --install "cmake;3.22.1" "ndk;27.0.12077973" || true

      - name: Install dependencies
        run: flutter pub get

      - name: Generate code (l10n + build_runner)
        run: |
          flutter gen-l10n
          dart run build_runner build --delete-conflicting-outputs

      - name: Build Android (debug APK)
        shell: bash
        run: |
          for i in 1 2 3; do
            echo "=== Attempt $i ==="
            flutter build apk --debug --no-pub && break
            echo "Attempt $i failed, retrying in 10s..."
            sleep 10
          done

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: songjiang_reader-android-debug
          path: build/app/outputs/flutter-apk/*.apk
          if-no-files-found: warn
          retention-days: 7

  # ============ Android release（打 tag 时才跑） ============
  # 需要在仓库 Settings → Secrets 里配置：
  #   KEYSTORE_BASE64      = base64 -w0 android/app/release.jks
  #   KEYSTORE_PASSWORD / KEY_ALIAS / KEY_PASSWORD
  build-android-release:
    name: Build Android (release AAB + APK)
    runs-on: windows-latest
    timeout-minutes: 90
    needs: analyze-and-test
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Flutter 3.35.3
        uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.35.3
          channel: stable

      - name: Enable git long paths
        run: git config --system core.longpaths true

      - name: Ensure Gradle wrapper
        shell: bash
        run: |
          SDK="$(dirname "$(dirname "$(command -v flutter)")")"
          cp "$SDK/bin/cache/artifacts/gradle_wrapper/gradlew" android/gradlew
          cp "$SDK/bin/cache/artifacts/gradle_wrapper/gradlew.bat" android/gradlew.bat
          mkdir -p android/gradle/wrapper
          cp "$SDK/bin/cache/artifacts/gradle_wrapper/gradle/wrapper/gradle-wrapper.jar" android/gradle/wrapper/gradle-wrapper.jar

      - name: Install Android CMake & NDK
        shell: bash
        run: |
          SM="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          [ -x "$SM" ] || SM="$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SM" --install "cmake;3.22.1" "ndk;27.0.12077973" || true

      - name: Restore signing keystore
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "未配置签名密钥，跳过（release 构建将使用 debug 签名）"
            exit 0
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > android/app/release.jks
          cat > android/key.properties <<EOF
          storeFile=release.jks
          storePassword=$KEYSTORE_PASSWORD
          keyAlias=$KEY_ALIAS
          keyPassword=$KEY_PASSWORD
          EOF

      - name: Install dependencies
        run: flutter pub get

      - name: Generate code (l10n + build_runner)
        run: |
          flutter gen-l10n
          dart run build_runner build --delete-conflicting-outputs

      - name: Build release APK & AAB
        run: |
          flutter build apk --release --no-pub
          flutter build appbundle --release --no-pub

      - name: Upload release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: songjiang_reader-android-release-${{ github.ref_name }}
          path: |
            build/app/outputs/flutter-apk/*.apk
            build/app/outputs/bundle/release/*.aab
          if-no-files-found: warn
          retention-days: 30

  # ============ macOS / iOS ============
  build-apple:
    name: Build macOS & iOS
    runs-on: macos-latest
    timeout-minutes: 60
    needs: analyze-and-test
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter 3.35.3
        uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.35.3
          channel: stable

      - name: Cache pub dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.pub-cache
            .dart_tool/package_config.json
          key: ${{ runner.os }}-pub-${{ hashFiles('**/pubspec.lock') }}
          restore-keys: |
            ${{ runner.os }}-pub-

      - name: Install dependencies
        run: flutter pub get

      - name: Generate code (l10n + build_runner)
        run: |
          flutter gen-l10n
          dart run build_runner build --delete-conflicting-outputs

      # macOS/iOS 构建需要 pod install，runner 上的 CocoaPods specs 可能过期。
      # 比 pod repo update 更可靠的方式：清理后重建。
      - name: Prepare CocoaPods specs
        run: |
          echo "=== CocoaPods version ==="
          pod --version
          echo "=== Reset specs repo ==="
          pod repo remove trunk 2>/dev/null || true
          pod repo add-cdn trunk https://cdn.cocoapods.org/
          echo "=== Done ==="

      - name: Build macOS (debug)
        run: flutter build macos --debug

      # 无签名构建（CI 没有开发者证书）；上架前需本地配好签名后再归档
      - name: Build iOS (debug, no codesign)
        run: flutter build ios --debug --no-codesign

      - name: Upload macOS artifact
        uses: actions/upload-artifact@v4
        with:
          name: songjiang_reader-macos-debug
          path: build/macos/Build/Products/Debug/*.app
          if-no-files-found: warn
          retention-days: 7

  # ============ Linux ============
  build-linux:
    name: Build Linux (debug)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    needs: analyze-and-test
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            clang cmake ninja-build pkg-config \
            libgtk-3-dev liblzma-dev libstdc++-12-dev \
            libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev \
            libasound2-dev

      - name: Setup Flutter 3.35.3
        uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.35.3
          channel: stable

      - name: Cache pub dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.pub-cache
            .dart_tool/package_config.json
          key: ${{ runner.os }}-pub-${{ hashFiles('**/pubspec.lock') }}
          restore-keys: |
            ${{ runner.os }}-pub-

      - name: Install dependencies
        run: flutter pub get

      - name: Generate code (l10n + build_runner)
        run: |
          flutter gen-l10n
          dart run build_runner build --delete-conflicting-outputs

      - name: Build Linux (debug)
        run: flutter build linux --debug --no-pub

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: songjiang_reader-linux-debug
          path: build/linux/x64/debug/bundle
          if-no-files-found: warn
          retention-days: 7
