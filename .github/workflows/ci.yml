name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]

# 取消同一分支/同一 PR 上正在跑的旧 run，避免资源浪费
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ============ 分析 + 单元测试 (Linux, 最快) ============
  analyze-and-test:
    name: Analyze & test (ubuntu)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter 3.35.3
        uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.35.3
          channel: stable

      - name: Cache pub dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.pub-cache
            .dart_tool/package_config.json
          key: ${{ runner.os }}-pub-${{ hashFiles('**/pubspec.lock') }}
          restore-keys: |
            ${{ runner.os }}-pub-

      - name: Install dependencies
        run: flutter pub get

      - name: Generate code (l10n + build_runner)
        shell: bash
        run: |
          rm -f build.yaml
          flutter gen-l10n
          dart run build_runner build --delete-conflicting-outputs

      - name: Analyze
        run: |
          set +e
          OUTPUT=$(flutter analyze --no-pub --no-fatal-infos --no-fatal-warnings 2>&1)
          CODE=$?
          set -e
          echo "$OUTPUT"
          echo "flutter analyze raw exit=$CODE"
          if echo "$OUTPUT" | grep -E '^\s*error\s+-'; then
            echo "::error::flutter analyze reported error-level issues"
            exit 1
          fi
          if echo "$OUTPUT" | grep -qi 'failed to compile\|error-causing\|Unhandled exception'; then
            echo "::error::flutter analyze failed to complete"
            exit 1
          fi
          echo "Analyze OK (no error-level issues)"

      - name: Run tests
        run: flutter test --no-pub --reporter expanded

  # ============ Windows ============
  build-windows:
    name: Build Windows
    runs-on: windows-2019
    timeout-minutes: 60
    needs: analyze-and-test
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Enable git long paths
        run: git config --system core.longpaths true

      - name: Setup Flutter 3.35.3
        uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.35.3
          channel: stable

      - name: Cache pub dependencies
        uses: actions/cache@v4
        with:
          path: |
            C:\Users\runneradmin\.pub-cache
            .dart_tool/package_config.json
          key: ${{ runner.os }}-pub-${{ hashFiles('**/pubspec.lock') }}
          restore-keys: |
            ${{ runner.os }}-pub-

      - name: Install dependencies
        run: flutter pub get

      - name: Generate code (l10n + build_runner)
        shell: bash
        run: |
          rm -f build.yaml
          flutter gen-l10n
          dart run build_runner build --delete-conflicting-outputs

      - name: Build Windows (release)
        run: flutter build windows --release

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: songjiang_reader-windows-release
          path: build/windows/x64/runner/Release
          if-no-files-found: warn
          retention-days: 7

  # ============ Android ============
  build-android:
    name: Build Android (debug APK)
    runs-on: windows-latest
    timeout-minutes: 60
    needs: analyze-and-test
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Flutter 3.35.3
        uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.35.3
          channel: stable

      - name: Cache pub dependencies
        uses: actions/cache@v4
        with:
          path: |
            C:\Users\runneradmin\.pub-cache
            .dart_tool/package_config.json
          key: ${{ runner.os }}-pub-${{ hashFiles('**/pubspec.lock') }}
          restore-keys: |
            ${{ runner.os }}-pub-

      - name: Enable git long paths
        run: git config --system core.longpaths true

      - name: Ensure Gradle wrapper
        shell: bash
        run: |
          SDK="$(dirname "$(dirname "$(command -v flutter)")")"
          cp "$SDK/bin/cache/artifacts/gradle_wrapper/gradlew" android/gradlew
          cp "$SDK/bin/cache/artifacts/gradle_wrapper/gradlew.bat" android/gradlew.bat
          mkdir -p android/gradle/wrapper
          cp "$SDK/bin/cache/artifacts/gradle_wrapper/gradle/wrapper/gradle-wrapper.jar" android/gradle/wrapper/gradle-wrapper.jar

      - name: Install Android CMake & NDK
        shell: bash
        run: |
          SM="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          [ -x "$SM" ] || SM="$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SM" --install "cmake;3.22.1" "ndk;27.0.12077973" || true

      - name: Install dependencies
        run: flutter pub get

      - name: Generate code (l10n + build_runner)
        shell: bash
        run: |
          rm -f build.yaml
          flutter gen-l10n
          dart run build_runner build --delete-conflicting-outputs

      - name: Build Android (debug APK)
        shell: bash
        run: |
          for i in 1 2 3; do
            echo "=== Attempt $i ==="
            flutter build apk --debug --no-pub && break
            echo "Attempt $i failed, retrying in 10s..."
            sleep 10
          done

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: songjiang_reader-android-debug
          path: build/app/outputs/flutter-apk/*.apk
          if-no-files-found: warn
          retention-days: 7

  # ============ macOS ============
  build-macos:
    name: Build macOS
    runs-on: macos-latest
    timeout-minutes: 60
    needs: analyze-and-test
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter 3.35.3
        uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.35.3
          channel: stable

      - name: Cache pub dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.pub-cache
            .dart_tool/package_config.json
          key: ${{ runner.os }}-pub-${{ hashFiles('**/pubspec.lock') }}
          restore-keys: |
            ${{ runner.os }}-pub-

      - name: Install dependencies
        run: flutter pub get

      - name: Generate code (l10n + build_runner)
        shell: bash
        run: |
          rm -f build.yaml
          flutter gen-l10n
          dart run build_runner build --delete-conflicting-outputs

      - name: Prepare CocoaPods
        run: |
          pod --version
          pod repo remove trunk 2>/dev/null || true
          pod repo add-cdn trunk https://cdn.cocoapods.org/
          rm -f macos/Podfile.lock

      - name: Build macOS (debug)
        run: flutter build macos --debug --no-pub

      - name: Upload macOS artifact
        uses: actions/upload-artifact@v4
        with:
          name: songjiang_reader-macos-debug
          path: build/macos/Build/Products/Debug/*.app
          if-no-files-found: warn
          retention-days: 7

  # ============ iOS（无开发者账号：打出未签名 IPA，供 TrollStore 侧载） ============
  build-ios-unsigned:
    name: Build iOS (unsigned IPA / TrollStore)
    runs-on: macos-latest
    timeout-minutes: 90
    needs: analyze-and-test
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter 3.35.3
        uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.35.3
          channel: stable

      - name: Cache pub dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.pub-cache
            .dart_tool/package_config.json
          key: ${{ runner.os }}-pub-${{ hashFiles('**/pubspec.lock') }}
          restore-keys: |
            ${{ runner.os }}-pub-

      - name: Install dependencies
        run: flutter pub get

      - name: Generate code (l10n + build_runner)
        shell: bash
        run: |
          rm -f build.yaml
          flutter gen-l10n
          dart run build_runner build --delete-conflicting-outputs

      - name: Prepare CocoaPods
        run: |
          pod --version
          pod repo remove trunk 2>/dev/null || true
          pod repo add-cdn trunk https://cdn.cocoapods.org/
          rm -f ios/Podfile.lock

      - name: Build iOS (release, no codesign)
        run: flutter build ios --release --no-codesign --no-pub

      - name: Package IPA
        run: |
          set -euo pipefail
          APP_DIR="build/ios/iphoneos"
          if [ ! -d "$APP_DIR/Runner.app" ]; then
            APP_DIR="build/ios/Release-iphoneos"
          fi
          test -d "$APP_DIR/Runner.app"
          STAGE=$(mktemp -d)
          mkdir -p "$STAGE/Payload"
          cp -R "$APP_DIR/Runner.app" "$STAGE/Payload/"
          (
            cd "$STAGE"
            zip -qry SongJiang-Reader-ios-unsigned.ipa Payload
          )
          mkdir -p build/ios-artifacts
          cp "$STAGE/SongJiang-Reader-ios-unsigned.ipa" build/ios-artifacts/
          ls -la build/ios-artifacts/

      - name: Upload iOS IPA
        uses: actions/upload-artifact@v4
        with:
          name: songjiang_reader-ios-unsigned-ipa
          path: build/ios-artifacts/*.ipa
          if-no-files-found: error
          retention-days: 14

  # ============ Linux ============
  build-linux:
    name: Build Linux (debug)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    needs: analyze-and-test
    continue-on-error: true
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            clang cmake ninja-build pkg-config \
            libgtk-3-dev liblzma-dev libstdc++-12-dev \
            libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev \
            libasound2-dev \
            libwpe-1.0-dev libwpebackend-fdo-1.0-dev \
            libwpewebkit-1.0-dev || \
          sudo apt-get install -y \
            clang cmake ninja-build pkg-config \
            libgtk-3-dev liblzma-dev libstdc++-12-dev \
            libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev \
            libasound2-dev \
            libwpe-1.0-dev libwpebackend-fdo-1.0-dev

      - name: Setup Flutter 3.35.3
        uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.35.3
          channel: stable

      - name: Cache pub dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.pub-cache
            .dart_tool/package_config.json
          key: ${{ runner.os }}-pub-${{ hashFiles('**/pubspec.lock') }}
          restore-keys: |
            ${{ runner.os }}-pub-

      - name: Install dependencies
        run: flutter pub get

      - name: Generate code (l10n + build_runner)
        shell: bash
        run: |
          rm -f build.yaml
          flutter gen-l10n
          dart run build_runner build --delete-conflicting-outputs

      - name: Build Linux (debug)
        run: flutter build linux --debug --no-pub

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: songjiang_reader-linux-debug
          path: build/linux/x64/debug/bundle
          if-no-files-found: warn
          retention-days: 7
