<script>
// Polyfills for older Android WebView / Chromium.
// foliate-js uses parents.at(-1) and findLastIndex; without these,
// chapters silently fail to render (no images, no text).
if (!Array.prototype.at) {
  Object.defineProperty(Array.prototype, 'at', {
    value(index) {
      const length = this.length >>> 0
      let k = Math.trunc(index) || 0
      if (k < 0) k += length
      if (k < 0 || k >= length) return undefined
      return this[k]
    },
    writable: true, configurable: true,
  })
}
if (!Array.prototype.findLastIndex) {
  Object.defineProperty(Array.prototype, 'findLastIndex', {
    value(fn) {
      for (let i = this.length - 1; i >= 0; i--) {
        if (fn(this[i], i, this)) return i
      }
      return -1
    },
    writable: true, configurable: true,
  })
}
</script>

<script>
  // Polyfill Array.prototype.at for older WebView/Chromium (< Android 8 / Chrome < 92)
  // foliate-js uses parents.at(-1) in loadItem; without this, chapters silently fail.
  if (!Array.prototype.at) {
    Object.defineProperty(Array.prototype, 'at', {
      value: function (index) {
        var length = this.length >>> 0
        var k = Math.trunc(index) || 0
        if (k < 0) k += length
        if (k < 0 || k >= length) return undefined
        return this[k]
      },
      writable: true,
      configurable: true,
    })
  }
  // Polyfill Array.prototype.findLastIndex (Chrome < 97)
  if (!Array.prototype.findLastIndex) {
    Object.defineProperty(Array.prototype, 'findLastIndex', {
      value: function (fn) {
        for (var i = this.length - 1; i >= 0; i--) {
          if (fn(this[i], i, this)) return i
        }
        return -1
      },
      writable: true,
      configurable: true,
    })
  }
</script>
<script>
  (function () {
    const ua = navigator.userAgent || '';
    const platform = navigator.platform || '';
    console.log('SjUA', ua);

    const isAppleDevice = /iPad|iPhone|iPod/.test(ua)
      || (/Mac/.test(platform) && navigator.maxTouchPoints > 1)
      || /Mac OS X/.test(ua);

    const chromeMatch = ua.match(/Chrome\/(\d+)/);
    const chromeVersion = chromeMatch ? parseInt(chromeMatch[1], 10) : NaN;
    const shouldUseModernBundle = isAppleDevice || (!Number.isNaN(chromeVersion) && chromeVersion >= 100);

    const loadScript = (src, options = {}) => new Promise((resolve, reject) => {
      const script = document.createElement('script');
      script.src = src;
      if (options.type) script.type = options.type;
      if (options.async !== undefined) script.async = options.async;
      if (options.defer !== undefined) script.defer = options.defer;
      script.onload = () => resolve();
      script.onerror = (err) => {
        console.error('Failed to load script', src, err);
        reject(err);
      };
      document.head.appendChild(script);
    });

    (async () => {
      if (shouldUseModernBundle) {
        await loadScript('./src/vendor/pdfjs/pdf.js', { async: false, defer: false });
        await loadScript('./src/book.js', { type: 'module' });
        return;
      }

      await loadScript('./dist/bundle.js', { type: 'module' });
      await loadScript('./dist/pdf-legacy.js', { async: false, defer: false });
    })();
  })();
</script>
